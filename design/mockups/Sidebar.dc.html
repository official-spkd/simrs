<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Navigasi samping</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<nav aria-label="Navigasi utama" style="width: 240px; min-height: 100vh; box-sizing: border-box; background: rgba(255,255,255,0.94); border-right: 1px solid #E3E8EE; display: flex; flex-direction: column; gap: 14px; padding: 18px 12px; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #14212B; font-size: 13.5px; line-height: 1.4">
<div style="display: flex; align-items: center; gap: 10px; padding: 0 6px">
<div style="width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(135deg, #1D7E77, #0F766E); display: flex; align-items: center; justify-content: center; color: #FFFFFF; box-shadow: 0 2px 6px rgba(15,118,110,0.25)">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
</div>
<div style="display: flex; flex-direction: column">
<span style="font-weight: 700; font-size: 14px">[NAMA RS]</span>
<span style="font-size: 12px; color: #5B6B79">{{unit}}</span>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 1px">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="6">
<span style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: #6B7A87; padding: 10px 10px 4px">{{g.title}}</span>
<sc-for list="{{g.items}}" as="n" hint-placeholder-count="3">
<a href="{{n.href}}" title="{{n.tip}}" aria-current="{{n.current}}" style="display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px; color: {{n.fg}}; background: {{n.bg}}; font-weight: {{n.weight}}; text-decoration: none; opacity: {{n.op}}">
<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.d}}"></path></svg>
<span style="flex: 1">{{n.label}}</span>
<span style="font-size: 11.5px; font-weight: 600; color: {{n.countFg}}; background: {{n.countBg}}; padding: 0 7px; border-radius: 999px">{{n.count}}</span>
</a>
</sc-for>
</sc-for>
</div>
<div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
<a href="Integrasi.dc.html" style="display: flex; flex-direction: column; gap: 5px; padding: 10px 12px; border-radius: 10px; background: linear-gradient(180deg, #F2FAF8, #FFFFFF); border: 1px solid #D5ECE7; text-decoration: none">
<span style="font-size: 12px; font-weight: 600; color: #0B5D56">Status integrasi</span>
<span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #3F4C58"><span style="width: 7px; height: 7px; border-radius: 999px; background: #16A34A"></span>SATUSEHAT · normal</span>
<span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #3F4C58"><span style="width: 7px; height: 7px; border-radius: 999px; background: #16A34A"></span>BPJS · normal</span>
<span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #3F4C58"><span style="width: 7px; height: 7px; border-radius: 999px; background: #16A34A"></span>Server edge RS · tersinkron</span>
</a>
<a href="Login.dc.html" title="Keluar" style="display: flex; align-items: center; gap: 10px; border-top: 1px solid #E3E8EE; padding: 12px 6px 0; text-decoration: none; color: inherit">
<div style="width: 34px; height: 34px; border-radius: 999px; background: #E6F4F1; color: #0B5D56; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px">{{initials}}</div>
<div style="display: flex; flex-direction: column; min-width: 0">
<span style="font-weight: 600; font-size: 13px">{{user}}</span>
<span style="font-size: 12px; color: #5B6B79">{{role}}</span>
</div>
</a>
</div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","default":"poli","options":["beranda","simulasi","daftar","antrean","jadwal","poli","igd","ranap","bed","lab","rad","farmasi","ok","kasir","pembayaran","pembiayaan","klaim","akuntansi","dasbor","rm","logistik","mutu","akses","audit","formulir","integrasi"]},"user":{"editor":"text","default":"dr. [Nama DPJP], Sp.PD"},"role":{"editor":"text","default":"DPJP · Poli Penyakit Dalam"},"initials":{"editor":"text","default":"DR"},"unit":{"editor":"text","default":"SIM RS"},"$preview":{"width":240,"height":1180}}'>

};
var HREF = { simulasi: 'Simulasi.dc.html', pembayaran: 'PembayaranBTN.dc.html', pembiayaan: 'PembiayaanBTN.dc.html', beranda: 'Main.dc.html', daftar: 'Registrasi.dc.html', antrean: 'DisplayAntrean.dc.html', jadwal: 'Jadwal.dc.html', poli: 'Main.dc.html', igd: 'IGD.dc.html', ranap: 'Ranap.dc.html', bed: 'BedManagement.dc.html', lab: 'Lab.dc.html', farmasi: 'Farmasi.dc.html', ok: 'OK.dc.html', kasir: 'Kasir.dc.html', klaim: 'Klaim.dc.html', akuntansi: 'Akuntansi.dc.html', dasbor: 'Dasbor.dc.html', rm: 'MPI.dc.html', logistik: 'Logistik.dc.html', akses: 'Akses.dc.html', audit: 'Audit.dc.html', formulir: 'Formulir.dc.html', integrasi: 'Integrasi.dc.html' };
var groups = [

{ title: 'KLINIS', items: [{ id: 'poli', label: 'Pasien saya', d: I.users, count: '5' }, { id: 'igd', label: 'IGD', d: I.pulse, count: '9', urgent: true }, { id: 'ranap', label: 'Rawat inap', d: I.bed }, { id: 'bed', label: 'Tempat tidur', d: I.layout }] },

return { title: g.title, items: g.items.map(function (n) {
var on = n.id === active;
return Object.assign({}, n, {
current: on ? 'page' : 'false',
href: HREF[n.id] || '#',
tip: HREF[n.id] ? n.label : n.label + ' · layar belum dirancang',
op: HREF[n.id] ? 1 : 0.55,
bg: on ? 'linear-gradient(90deg, #E2F2EE, #F1F9F7)' : 'transparent',

});
}) };
});
return {
groups: groups,
user: this.props.user ?? 'dr. [Nama DPJP], Sp.PD',
role: this.props.role ?? 'DPJP · Poli Penyakit Dalam',

unit: this.props.unit ?? 'SIM RS'
};
}
}
</script>
</body>
</html>
