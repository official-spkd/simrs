  <text class="s" x="384" y="225">hibrida: Pendaftaran, Jadwal, Anjungan, Display antrean</text>
  <text class="xs" x="384" y="243">api: Kendali antrean · demo: Rujukan, Info publik</text>
  <rect class="row" x="24" y="258" width="952" height="48" rx="10"/>
  <circle class="num" cx="50" cy="282" r="15"/><text class="numt" x="50" y="286" text-anchor="middle">3</text>
  <text class="t" x="76" y="279">Klinis RME</text>
  <rect class="cwarn" x="76" y="286" width="74" height="16" rx="8"/><text class="chip twarn" x="113" y="298" text-anchor="middle">berjalan</text>
  <text class="cnt" x="214" y="287">7 hibrida · 10 demo</text>
  <text class="s" x="384" y="279">hibrida: Poli, CPOE, IGD, Tempat tidur, Rawat inap, Resume, Persetujuan</text>
  <text class="xs" x="384" y="297">demo: Worklist, CPPT, Asesmen, Diagnosis, Konsul, Edukasi, Askep, Ringkasan, Paket, Kelengkapan</text>
  <rect class="row" x="24" y="312" width="952" height="48" rx="10"/>
  <circle class="num" cx="50" cy="336" r="15"/><text class="numt" x="50" y="340" text-anchor="middle">4</text>
  <text class="t" x="76" y="333">Penunjang</text>
  <rect class="cno" x="76" y="340" width="74" height="16" rx="8"/><text class="chip tno" x="113" y="352" text-anchor="middle">belum</text>
