  <text class="s" x="384" y="387">Kasir, Klaim &amp; koding, Akuntansi, Tarif &amp; paket, Charge capture</text>
  <text class="xs" x="384" y="405">Piutang, Workbench koder, Jasa pelayanan, Kas &amp; bank, Hutang usaha</text>
  <rect class="row" x="24" y="420" width="952" height="48" rx="10"/>
  <circle class="num" cx="50" cy="444" r="15"/><text class="numt" x="50" y="448" text-anchor="middle">6</text>
  <text class="t" x="76" y="441">Pembayaran BTN</text>
  <rect class="cno" x="76" y="448" width="74" height="16" rx="8"/><text class="chip tno" x="113" y="460" text-anchor="middle">belum</text>
  <text class="cnt" x="214" y="449">2 demo</text>
  <text class="s" x="384" y="441">Pembayaran digital TPDI × BTN, Pembiayaan BTN</text>
  <text class="xs" x="384" y="459">dana langsung ke rekening RS (ADR-0005)</text>
  <rect class="row" x="24" y="474" width="952" height="48" rx="10"/>
  <circle class="num" cx="50" cy="498" r="15"/><text class="numt" x="50" y="502" text-anchor="middle">7</text>
  <text class="t" x="76" y="495">Integrasi</text>
  <rect class="cno" x="76" y="502" width="74" height="16" rx="8"/><text class="chip tno" x="113" y="514" text-anchor="middle">belum</text>
  <text class="cnt" x="214" y="503">6 demo</text>
  <text class="s" x="384" y="495">Integration hub, SATUSEHAT, Konektor BPJS</text>
  <text class="xs" x="384" y="513">Kemenkes (SIRS), Perangkat medis, API publik &amp; FHIR</text>
  <rect class="row" x="24" y="528" width="952" height="48" rx="10"/>
  <circle class="num" cx="50" cy="552" r="15"/><text class="numt" x="50" y="556" text-anchor="middle">8</text>
  <text class="t" x="76" y="549">Back office</text>
  <rect class="cno" x="76" y="556" width="74" height="16" rx="8"/><text class="chip tno" x="113" y="568" text-anchor="middle">belum</text>
  <text class="cnt" x="214" y="557">13 demo</text>
  <text class="s" x="384" y="549">Logistik, Mutu, RM administratif, SDM, Kredensial, PPI, Aset</text>
