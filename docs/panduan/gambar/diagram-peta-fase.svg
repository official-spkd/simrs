  <rect class="row" x="24" y="366" width="952" height="48" rx="10"/>
  <circle class="num" cx="50" cy="390" r="15"/><text class="numt" x="50" y="394" text-anchor="middle">5</text>
  <text class="t" x="76" y="387">Keuangan</text>
  <rect class="cno" x="76" y="394" width="74" height="16" rx="8"/><text class="chip tno" x="113" y="406" text-anchor="middle">belum</text>
