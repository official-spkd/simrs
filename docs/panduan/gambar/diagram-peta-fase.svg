<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="1000" height="760" role="img" aria-labelledby="judul ket">
  <title id="judul">Peta fase ke kelompok layar</title>
  <desc id="ket">Sebelas fase SIM RS (0 sampai 10) dengan status backend dan layar web per fase. Fase 0 sampai 2 selesai, fase 3 berjalan, fase 4 sampai 9 belum dibangun backend-nya tetapi semua layarnya sudah ada di mode presentasi, fase 10 sebagian. Registri SCREENS berisi 80 layar; layar fase 1 yang tersambung API berada di luar registri.</desc>
  <style>
    .bg{fill:#F5F7F9}.row{fill:#FFFFFF;stroke:#E3E8EE;stroke-width:1.2}.leg{fill:#E6F4F1;stroke:#0F766E;stroke-width:1.2}
    .cok{fill:#EAF5EC;stroke:#1E6B34}.cwarn{fill:#FFF3E0;stroke:#8A4B00}.cno{fill:#F1F3F5;stroke:#98A6B3}
    text{font-family:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#14212B;font-size:13px}
    .h{font-size:19px;font-weight:700}.sub{font-size:13px;fill:#3F4C58}.t{font-size:14px;font-weight:700}.cap{font-size:11px;font-weight:700;letter-spacing:.08em;fill:#5B6B79}
    .s{font-size:12px;fill:#14212B}.xs{font-size:11.5px;fill:#3F4C58}.cnt{font-size:12px;font-weight:600;fill:#0B5D56}
    .chip{font-size:10.5px;font-weight:700}.tok{fill:#1E6B34}.twarn{fill:#8A4B00}.tno{fill:#5B6B79}
    .num{fill:#0F766E}.numt{fill:#FFFFFF;font-size:12px;font-weight:700}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0E161C}.row{fill:#15212A;stroke:#2A3945}.leg{fill:#0F302D;stroke:#3FB8AA}
      .cok{fill:#12301D;stroke:#6FCF8A}.cwarn{fill:#362510;stroke:#F0B45A}.cno{fill:#1C2731;stroke:#55687A}
      text{fill:#E6EDF3}.sub,.xs{fill:#B8C4CE}.cap,.tno{fill:#8FA1B0}.s{fill:#E6EDF3}.cnt{fill:#6FD3C6}.tok{fill:#6FCF8A}.twarn{fill:#F0B45A}
      .num{fill:#3FB8AA}.numt{fill:#0E161C}
    }
  </style>
  <rect class="bg" x="0" y="0" width="1000" height="760" rx="14"/>
  <text class="h" x="24" y="38">Peta fase: dari fondasi sampai pilot</text>
  <text class="sub" x="24" y="60">Status = backend fase itu (docs/PROGRESS.md). Layar fase 2–10 sudah ada di mode presentasi sebelum backend-nya jadi (ADR-0023).</text>
  <text class="cap" x="24" y="86">FASE · BACKEND</text>
  <text class="cap" x="214" y="86">LAYAR (SUMBER DATA)</text>
  <text class="cap" x="384" y="86">KELOMPOK LAYAR</text>
  <rect class="row" x="24" y="96" width="952" height="48" rx="10"/>
  <circle class="num" cx="50" cy="120" r="15"/><text class="numt" x="50" y="124" text-anchor="middle">0</text>
  <text class="t" x="76" y="117">Fondasi</text>
  <rect class="cok" x="76" y="124" width="74" height="16" rx="8"/><text class="chip tok" x="113" y="136" text-anchor="middle">selesai</text>
  <text class="cnt" x="214" y="125">—</text>
  <text class="s" x="384" y="117">Fondasi UI (/dev/ui), panduan superadmin, mock + panel kendali</text>
  <text class="xs" x="384" y="135">RLS, outbox, worker, sistem desain Klinis Bersih</text>
  <rect class="row" x="24" y="150" width="952" height="48" rx="10"/>
  <circle class="num" cx="50" cy="174" r="15"/><text class="numt" x="50" y="178" text-anchor="middle">1</text>
  <text class="t" x="76" y="171">Platform inti</text>
  <rect class="cok" x="76" y="178" width="74" height="16" rx="8"/><text class="chip tok" x="113" y="190" text-anchor="middle">selesai</text>
  <text class="cnt" x="214" y="179">6 api · 5 demo</text>
  <text class="s" x="384" y="171">api: Pengguna &amp; akses, Audit, MPI, Formulir, Notifikasi, PIN</text>
  <text class="xs" x="384" y="189">demo: Struktur RS, Pengaturan, Data rujukan, Dokumen &amp; TTE, Penjadwal</text>
  <rect class="row" x="24" y="204" width="952" height="48" rx="10"/>
  <circle class="num" cx="50" cy="228" r="15"/><text class="numt" x="50" y="232" text-anchor="middle">2</text>
  <text class="t" x="76" y="225">Front office</text>
  <rect class="cok" x="76" y="232" width="74" height="16" rx="8"/><text class="chip tok" x="113" y="244" text-anchor="middle">selesai</text>
