  <rect class="row" x="24" y="582" width="952" height="48" rx="10"/>
  <circle class="num" cx="50" cy="606" r="15"/><text class="numt" x="50" y="610" text-anchor="middle">9</text>
  <text class="t" x="76" y="603">Dasbor + kanal</text>
  <rect class="cno" x="76" y="610" width="74" height="16" rx="8"/><text class="chip tno" x="113" y="622" text-anchor="middle">belum</text>
  <text class="cnt" x="214" y="611">6 demo</text>
  <text class="s" x="384" y="603">Dasbor eksekutif, Command center, Costing &amp; case-mix, Dataset riset</text>
  <text class="xs" x="384" y="621">pratinjau Aplikasi pasien dan Aplikasi dokter</text>
  <rect class="row" x="24" y="636" width="952" height="48" rx="10"/>
  <circle class="num" cx="50" cy="660" r="15"/><text class="numt" x="50" y="664" text-anchor="middle">10</text>
  <text class="t" x="76" y="657">Simulasi + pilot</text>
  <rect class="cwarn" x="76" y="664" width="74" height="16" rx="8"/><text class="chip twarn" x="113" y="676" text-anchor="middle">sebagian</text>
  <text class="cnt" x="214" y="665">4 demo</text>
  <text class="s" x="384" y="657">Simulasi pasien, Mode downtime, Cadangan &amp; pemulihan, Kesiapan go-live</text>
  <text class="xs" x="384" y="675">backup terenkripsi, jangkar audit, rotasi kunci sudah (10.7–10.9)</text>
  <rect class="leg" x="24" y="700" width="952" height="44" rx="10"/>
  <text class="s" x="40" y="719"><tspan font-weight="700">api</tspan> = tersambung backend · <tspan font-weight="700">hibrida</tspan> = jalur demo + jalur api (izin sungguhan) · <tspan font-weight="700">demo</tspan> = data dummy fiktif (APP_ENV=local + DATA_SOURCE=demo)</text>
  <text class="xs" x="40" y="736">Registri apps/web/src/lib/screens.ts: 80 layar. Layar fase 1 yang tersambung API (akses, audit, MPI, formulir, notifikasi, PIN) di luar registri.</text>
